syntax = "proto3";
package plugin;
option go_package = "game-server/plugin-sdk/proto";

// 插件注册信息
message PluginInfo {
  string name = 1;
  string version = 2;
  string description = 3;
  string route_prefix = 4;
  repeated MenuItem menus = 5;
  repeated Permission perms = 6;
  string frontend_bundle = 7;
}

message MenuItem {
  string title = 1;
  string icon = 2;
  string path = 3;
  int32 sort = 4;
  repeated MenuItem children = 5;
}

message Permission {
  string key = 1;
  string title = 2;
}

message HttpRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string query = 5;
  int64 user_id = 10;
  int64 tenant_id = 11;
  repeated string roles = 12;
  repeated string permissions = 13;
  string db_dsn = 14;
}

message HttpResponse {
  int32 status_code = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

message CallPluginRequest {
  string target_plugin = 1;
  string method = 2;
  bytes payload = 3;
}

message CallPluginResponse {
  bytes payload = 1;
  string error = 2;
}

message Event {
  string source = 1;
  string type = 2;
  bytes payload = 3;
  int64 timestamp = 4;
}

message Empty {}

message HealthResponse {
  bool healthy = 1;
  string message = 2;
}

service PluginService {
  rpc Register(Empty) returns (PluginInfo);
  rpc HandleRequest(HttpRequest) returns (HttpResponse);
  rpc Healthcheck(Empty) returns (HealthResponse);
  rpc OnEvent(Event) returns (Empty);
  rpc CallPlugin(CallPluginRequest) returns (CallPluginResponse);
}

service HostService {
  rpc PublishEvent(Event) returns (Empty);
  rpc CallPlugin(CallPluginRequest) returns (CallPluginResponse);
}
