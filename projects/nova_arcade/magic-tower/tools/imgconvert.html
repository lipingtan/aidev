<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<pre id="out">loading…</pre>
<script>
const out=document.getElementById('out');
const src=new URLSearchParams(location.search).get('src')||'/refimg/wolf.webp';
const size=parseInt(new URLSearchParams(location.search).get('size')||'256',10);
const img=new Image();
img.onload=()=>{
  const c=document.createElement('canvas');
  // 保持纵横比缩放到 size
  const sc=Math.min(size/img.naturalWidth, size/img.naturalHeight);
  c.width=Math.max(1,Math.round(img.naturalWidth*sc)); c.height=Math.max(1,Math.round(img.naturalHeight*sc));
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img,0,0,c.width,c.height);
  out.textContent='PNGDATA:'+c.toDataURL('image/png').split(',')[1];
};
img.onerror=()=>{ out.textContent='ERR load '+src; };
img.src=src;
</script></body></html>
