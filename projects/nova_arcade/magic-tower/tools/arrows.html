<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="o">loading</pre>
<script>
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function arrow(dir){ // 0=up 1=right 2=down 3=left
  const c=document.createElement('canvas'); c.width=44; c.height=44;
  const x=c.getContext('2d'); x.clearRect(0,0,44,44);
  x.fillStyle='rgba(255,255,255,0.12)'; roundRect(x,2,2,40,40,9); x.fill();
  x.strokeStyle='rgba(255,255,255,0.4)'; x.lineWidth=2; roundRect(x,2,2,40,40,9); x.stroke();
  x.fillStyle='#ffffff'; x.save(); x.translate(22,22); x.rotate(dir*Math.PI/2);
  x.beginPath(); x.moveTo(0,-10); x.lineTo(10,8); x.lineTo(-10,8); x.closePath(); x.fill(); x.restore();
  return c.toDataURL('image/png').split(',')[1];
}
const o=document.getElementById('o');
o.textContent='JSONDATA:'+JSON.stringify({up:arrow(0),right:arrow(1),down:arrow(2),left:arrow(3)});
</script></body></html>
