<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body><pre id="out">loading…</pre>
<script>
const out = document.getElementById('out');
function log(s){ out.textContent += s + '\n'; }
const params = new URLSearchParams(location.search);
const src = params.get('src') || '/refimg/og.png';
const img = new Image();
img.onload = () => {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  log(`SRC: ${src}`);
  log(`DIM: ${c.width}x${c.height}`);
  // 只统计不透明像素（alpha>128）
  const freq = new Map();
  let opaque = 0;
  const valHist = new Array(32).fill(0); // 明度 0..31
  for (let i = 0; i < d.length; i += 4) {
    if (d[i+3] < 128) continue;
    opaque++;
    const hex = '#' + [d[i],d[i+1],d[i+2]].map(x=>x.toString(16).padStart(2,'0')).join('');
    freq.set(hex, (freq.get(hex)||0)+1);
    const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    valHist[Math.min(31, Math.floor(lum/8))]++;
  }
  log(`OPAQUE: ${opaque} / TOTAL: ${c.width*c.height}`);
  const sorted = [...freq.entries()].sort((a,b)=>b[1]-a[1]);
  log(`UNIQUE COLORS: ${sorted.length}`);
  log('--- TOP ' + Math.min(24, sorted.length) + ' COLORS (hex x count, % of opaque) ---');
  for (const [hex,n] of sorted.slice(0,24)) log(`${hex}  x${n}  ${(100*n/opaque).toFixed(1)}%`);
  log('--- VALUE HISTOGRAM (dark->light, 32 bins) ---');
  let line=''; for(let b=0;b<32;b++){ const bar='#'.repeat(Math.min(40, Math.round(valHist[b]/opaque*400))); line += `[${b}]${bar} `; if(b===15) log(line), line=''; } log(line);
  log('DONE');
};
img.onerror = () => { log('IMG LOAD ERROR: ' + src); };
img.src = src;
</script>
</body></html>
